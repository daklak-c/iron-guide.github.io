<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#161719"/>
  <line x1="30" y1="194" x2="370" y2="194" stroke="#353535" stroke-width="2"/>
  <rect x="80" y="190" width="240" height="4" fill="#4A4A4E"/>
  <!-- Athlete in Forearm Plank -->
  <circle cx="114" cy="138" r="10" fill="#D4D4D8"/>
  <!-- Rigid Straight Line from Shoulders through Core to Ankles -->
  <path d="M128 142 L210 154 L286 168" stroke="#D4D4D8" stroke-width="13" stroke-linecap="round"/>
  <!-- Highlighted Core / Abs -->
  <path d="M148 150 L208 159" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Forearm on Mat (90-degree elbow under shoulder) -->
  <path d="M138 144 L138 188 H114" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Toes braced on mat -->
  <line x1="286" y1="168" x2="288" y2="188" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- Alignment Reference Line -->
  <line x1="124" y1="124" x2="290" y2="150" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
