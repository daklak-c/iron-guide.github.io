<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#161719"/>
  <line x1="30" y1="204" x2="370" y2="204" stroke="#353535" stroke-width="2"/>
  <!-- Athlete in Hip-Hinge Romanian Deadlift Position -->
  <circle cx="146" cy="92" r="11" fill="#D4D4D8"/>
  <!-- Flat Hinged Torso -->
  <line x1="158" y1="98" x2="228" y2="126" stroke="#D4D4D8" stroke-width="14" stroke-linecap="round"/>
  <!-- Hamstrings & Glutes Highlight -->
  <path d="M230 126 L216 164" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Lower Leg -->
  <line x1="216" y1="164" x2="214" y2="202" stroke="#D4D4D8" stroke-width="10" stroke-linecap="round"/>
  <line x1="198" y1="202" x2="222" y2="202" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Straight Arms holding Barbell close to shins -->
  <line x1="172" y1="104" x2="188" y2="162" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round"/>
  <!-- Barbell & Plates at mid-shin -->
  <circle cx="188" cy="166" r="16" fill="#2A2B30" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="188" cy="166" r="5" fill="#FFFFFF"/>
  <!-- Hip Hinge & Bar Path Arrows -->
  <path d="M252 126 H274 M268 121 L276 126 L268 131" stroke="#A3A3A3" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M160 132 V168" stroke="#A3A3A3" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
