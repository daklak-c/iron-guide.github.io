<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#161719"/>
  <line x1="30" y1="204" x2="370" y2="204" stroke="#353535" stroke-width="2"/>
  <!-- Squat Rack Upright -->
  <line x1="140" y1="36" x2="140" y2="204" stroke="#4A4A4E" stroke-width="5"/>
  <line x1="140" y1="82" x2="152" y2="82" stroke="#737373" stroke-width="4"/>
